# GitHub Pages for Solveig.
#
# The site is built from the markdown already in the repository. There is no
# generated copy of any document, so a page cannot drift from the file it came
# from -- editing docs/GUIDE.md is editing the Guide page. GitHub runs the
# build, so nothing here needs a toolchain locally and `make` stays
# dependency-free.

title: Solveig
description: "Solveig — a small object-oriented language and its toolkit: bytecode compiler (Solas), virtual machine (SolVM), REPL (Solis) and debugger (Solid). Prototype-based, everything is a message send, 141 messages, no control-flow syntax and no operators outside @expr. 18k lines of C11, no dependencies."
url: https://hansolovkarlsson.github.io
baseurl: /Solveig

# These three are what let the repository's own markdown serve as the site.
# GitHub Pages enables them by default; naming them here is so the reason is
# written down rather than inherited silently.
#
#   optional-front-matter  renders .md files that have no front matter, which
#                          is all of them -- they are read on GitHub too, where
#                          front matter would show up as clutter
#   relative-links         rewrites [x](GUIDE.md) to the page it becomes
#   titles-from-headings   takes each page's title from its first heading
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

# The compiler, the VM, the REPL and the tests are read on GitHub, not here.
# examples/ and programs/ are deliberately not excluded: the guide and the
# tutorial link to those files, and Jekyll copies them through as plain text.
exclude:
  - Makefile
  - LICENSE
  - solas/
  - solis/
  - solum/
  - embed/
  - tests/
  - bin/
  - build/
  - scratch/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      # These are documents, not templates. Solum's `fill` writes placeholders
      # as {} and escapes a brace as {{ -- which is Liquid's own syntax, so a
      # page explaining `fill` is a Liquid syntax error if Liquid reads it. It
      # has no business reading them: nothing here interpolates anything, and
      # the same files are read unrendered on GitHub. Layouts are unaffected,
      # so the nav and the stylesheet link still work.
      render_with_liquid: false

markdown: kramdown
kramdown:
  input: GFM
