# Builds and runs the suite somewhere that is not the machine this was written
# on.
#
# The README says "no dependencies beyond a C11 compiler and `make`", and until
# this existed that claim had been checked by one compiler on one machine: Apple
# clang, arm64, macOS. `gcc` there is a shim for clang, so nothing had ever been
# through GCC or glibc or an x86 register allocator. A claim on the front page
# held true by somebody having looked once is the thing this repository keeps
# finding and does not keep.
#
# `fail-fast` is off on purpose. The question a first run answers is *what is
# not portable*, and stopping at the first answer turns one run into several.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Two compilers on Linux, because the interesting difference is glibc
          # and GCC rather than the kernel.
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          # And the machine it already builds on, so a regression there is
          # caught by the same run rather than by somebody noticing.
          - { os: macos-latest, cc: clang }

    steps:
      - uses: actions/checkout@v5

      # Named in the log, so a failure says which compiler produced it rather
      # than which label the matrix gave it.
      - name: Compiler
        run: ${{ matrix.cc }} --version

      # Two steps rather than one: `make test` builds what it needs, and
      # separating them says whether a red run failed to compile or failed a
      # check.
      - name: Build
        run: make CC=${{ matrix.cc }}

      # Bounded at the *step*, not only at the job. A job that hits its own
      # timeout is cancelled, and a cancelled job keeps no log -- which is how
      # a 25-minute hang on macOS left nothing behind saying which test it was
      # standing in. A step that times out fails, and the log survives, and
      # `make test` names each binary before running it.
      - name: Test
        timeout-minutes: 5
        run: make test CC=${{ matrix.cc }}

  # Undefined behaviour is the thing this repository has already been bitten by
  # once, and by luck rather than by a check: `frame->ip += READ_SHORT()` was
  # right for the project's whole life because clang happened to evaluate it in
  # the order that made it right. A compiler warning found that one. UBSan is
  # for the ones no warning states.
  #
  # ASan and UBSan have been run here before -- the changelog has several passes
  # of them against particular commits, some of which found real faults -- but
  # by hand, when somebody remembered, aimed at whatever had just changed. This
  # runs the whole suite, every push, which is the difference the portability
  # job made this morning.
  #
  # Linux, and clang, for a reason: LeakSanitizer does not work on macOS/arm64,
  # and `design.md` says in its status line that the language does not leak.
  # That is a claim, so it wants somewhere it can be checked.
  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make CC=clang SANITIZE="$SANITIZE"

      - name: Test
        timeout-minutes: 10
        run: make test CC=clang SANITIZE="$SANITIZE"
        env:
          # Without halt_on_error, UBSan prints what it found and carries on,
          # and the job stays green while saying it should not be.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1

    env:
      SANITIZE: -fsanitize=address,undefined -fno-omit-frame-pointer

  # `make install` and `make dist` make two claims that go stale silently, which
  # is the shape of every other thing that has gone wrong here: an installed
  # binary can find its library, and the tarball contains enough to build from.
  #
  # The first is the one that was actually broken. `argv[0]` says nothing when a
  # program is found on PATH, so before SOL_LIB_DIR existed, an installed
  # `solas` could not resolve `@include "text.sol"` at all -- and running it out
  # of the checkout, which is how it is always run here, hid that completely.
  install:
    name: install + dist
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install to a prefix
        run: make install PREFIX="$HOME/opt"

      # From a directory with no `lib/` in it and no `./bin`, by bare name off
      # PATH, which is the way an installed binary is actually used and the one
      # case a checkout never exercises.
      - name: Use it the way an install is used
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          printf '@include "text.sol".\n"installed":display.\n' > check.sol
          export PATH="$HOME/opt/bin:$PATH"
          solas check.sol
          test "$(solvm check.sob)" = installed

      - name: Take it back out
        run: |
          make uninstall PREFIX="$HOME/opt"
          test ! -e "$HOME/opt/bin/solas"
          test ! -e "$HOME/opt/lib/solum"

      # A tarball that does not build is worse than no tarball, because it is
      # found by somebody who wanted the thing to work.
      - name: Build from the tarball
        timeout-minutes: 10
        run: |
          make dist
          tar xzf solveig-*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/solveig-*/
          make
          ./bin/solvm --version
